<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This is a register form example" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />

    <link href="assets/style.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Multi-step Register Form | devChallenges.io</title>

  </head>
  <body>

    <main>
      
      <form id="multiStepForm">

        <div id="stepOne" class="form-step active">
          <div class="register-step">
            <h1>Register</h1>
            <div class="step-organize">
              <label for="name">Name</label>
              <input 
                type="text" 
                id="name" 
                name="name" 
                autocomplete="name"
                placeholder="Enter your name" 
                required
              >
            </div>
            <div class="step-organize">
              <label for="email">Email</label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                autocomplete="email"
                placeholder="Example@gmail.com" 
                required
              >
            </div>

            <button type="button" class="next-btn">Continue</button>
          </div>
        </div>


        <div id="stepTwo" class="form-step">
          <div class="register-step">
            <h1>Which topics you are interested in?</h1>
            <div class="interested-organize">
              <button type="button" class="topic-button">Software Development</button>
              <button type="button" class="topic-button">User Experience</button>
              <button type="button" class="topic-button">Graphic Design</button>
            </div>

            <button type="button" class="next-btn">Continue</button>
          </div>
        </div>

        <div id="stepThree" class="form-step">
          <div class="register-step">
            <h1>Summary</h1>

            <div class="summary"> 

              <div class="summary-data">
                <div class="user-data">
                  <dt>Name:</dt>
                  <dd></dd>
                </div>

                <div class="user-data">
                  <dt>Email:</dt>
                  <dd></dd>
                </div>
            
              </div>

              <div class="summary-topic">
                <h2>Topics:</h2>
                <ul></ul>
              </div>

            </div>

            <button type="button" class="next-btn">Continue</button>
          </div>
        </div>

        <div id="stepFour" class="form-step">
          <div class="send-form">
            <h1>Thank you!</h1>
            <p>form submitted.</p>
          </div>
        </div>
      </form>

      <div class="indicator active">
        <p>Step 1 of 3</p>
        <div class="step-indicator">
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
            <span class="step-dot"></span>
        </div>

      </div>

    </main>

    <footer class="author-info">
      Coded by <a href="#">Victor C. Ricci</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </footer>

    <script src="assets/script.js" defer></script>
  </body>
</html>
